name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    name: lake build + lake test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # lean-action reads the repository's lean-toolchain pin (v4.30.0) and
      # installs the matching Lean + Lake via elan.
      - name: Set up Lean (reads lean-toolchain)
        uses: leanprover/lean-action@v1

      - name: lake build
        run: lake build

      - name: lake test
        run: lake test

  python:
    name: ruff check + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The pytest suite exercises the Lean verifier executable through the
      # protocol; build it in this job so python validation is independent.
      - name: Set up Lean (reads lean-toolchain)
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Set up Python (reads pyproject.toml)
        run: uv python install

      - name: Sync locked dependencies
        run: uv sync --frozen --all-extras

      - name: ruff check .
        run: uv run --frozen ruff check .

      - name: pytest (skips dataset-backed tests on a public clone)
        run: uv run --frozen pytest

  contract:
    name: enforce CI does not call OpenRouter or depend on external dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: No OPENROUTER_API_KEY in CI environment
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is set in the CI environment; the public CI job must not see a provider key." >&2
            exit 1
          fi

      - name: Public clone does not require data/zebralogic/source.json
        run: |
          if [ -e data/zebralogic/source.json ]; then
            echo "data/zebralogic/source.json must not be committed; the public checkout is dataset-free." >&2
            exit 1
          fi