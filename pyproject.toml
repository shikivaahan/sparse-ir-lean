[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparseir-harness"
version = "0.1.0"
description = "Untrusted orchestration for the SparseIR Lean verifier"
requires-python = ">=3.11"
dependencies = [
  "clingo==5.8.0",
  "inspect-ai==0.3.241",
  "jsonschema>=4.25,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
sparseir-check-dataset = "sparseir_harness.dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sparseir_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
